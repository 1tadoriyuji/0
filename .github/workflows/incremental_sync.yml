name: Daily Incremental Manga Sync

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Target Language (chinese / japanese / english)"
        required: false
        default: "chinese"
      max_pages:
        description: "Max pages to inspect (1-10)"
        required: false
        default: "5"

jobs:
  incremental-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Incremental Sync
        env:
          ARCHIVE_CFG: ${{ secrets.ARCHIVE_CFG }}
          PYTHONUNBUFFERED: "1"
        run: |
          python incremental_sync_worker.py "${{ inputs.language || 'chinese' }}" "${{ inputs.max_pages || '5' }}"
