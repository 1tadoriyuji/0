name: Data Digest Sync

on:
  schedule:
    - cron: '0 3 * * *' # 每天 UTC 03:00 (北京时间 11:00) 自动同步官方热度指标
  workflow_dispatch:

jobs:
  digest-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Digest Indexer
        env:
          ARCHIVE_CFG: ${{ secrets.ARCHIVE_CFG }}
          PYTHONUNBUFFERED: "1"
        run: |
          python catalog_indexer.py
