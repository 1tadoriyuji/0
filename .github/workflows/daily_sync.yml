name: Daily Sync Pipeline

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Worker
        env:
          SYNC_CONFIG: ${{ secrets.SYNC_CONFIG }}
          PYTHONUNBUFFERED: "1"
        run: |
          python action_worker.py
