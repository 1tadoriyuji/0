name: BL Archive Stream Sync

on:
  workflow_dispatch:
    inputs:
      run_minutes:
        description: "Execution minutes"
        required: false
        default: "150"

jobs:
  bl-archive-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BL Archive Worker
        env:
          ARCHIVE_CFG: ${{ secrets.ARCHIVE_CFG }}
          RUN_MINUTES: ${{ inputs.run_minutes || '150' }}
          PYTHONUNBUFFERED: "1"
        run: |
          python bl_archive_worker.py
